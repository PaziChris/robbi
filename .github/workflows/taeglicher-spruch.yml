name: Täglicher Robbi-Spruch

on:
  schedule:
    # Ziel: jeden Tag um 16 Uhr in Österreich.
    # Zwei Startzeiten (14:07 und 15:07 UTC), damit es im Sommer UND im Winter passt.
    # Das Skript schickt erst ab 16 Uhr Wiener Zeit und nur einmal pro Tag.
    # GitHub startet geplante Läufe bei viel Betrieb manchmal verspätet.
    - cron: "7 14 * * *"
    - cron: "7 15 * * *"
  workflow_dispatch: {}   # erlaubt "Run workflow" zum Testen

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pakete installieren
        working-directory: robbi-web/scripts
        run: npm install --no-audit --no-fund
      - name: Sprüche verschicken
        working-directory: robbi-web/scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}   # "Run workflow" schickt sofort
        run: node send-push.mjs
